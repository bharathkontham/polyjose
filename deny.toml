# cargo-deny: enforces the pure-Rust crypto rule (no OpenSSL, ring or aws-lc) and license policy.
[bans]
multiple-versions = "warn"
deny = [
  { name = "openssl" }, { name = "openssl-sys" },
  { name = "ring" },
  { name = "aws-lc-rs" }, { name = "aws-lc-sys" },
  { name = "boring" }, { name = "boring-sys" },
  { name = "libsodium-sys" },
  # C/C++ build tooling: a pure-Rust tree never compiles native code (ADR 0002).
  { name = "cc" }, { name = "cmake" },
]

[sources]
# Only crates.io (the allow-registry default, stated explicitly): no git source, no other registry.
# cargo-deny does not check path sources; scripts/check-deps.sh rejects them in the core's tree.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]

[advisories]
# RUSTSEC-2023-0071 (rsa 0.9 Marvin timing leak) must never be ignored: polyjose requires rsa >= 0.10.
ignore = [
  # basic-toml is *unmaintained* (not a vulnerability). It reaches us only through uniffi_bindgen,
  # the build-time code generator behind uniffi's "cli" feature; it is never linked into a shipped
  # library. Re-check on every uniffi upgrade and drop this entry as soon as uniffi stops using it.
  { id = "RUSTSEC-2026-0374", reason = "build-time only via uniffi_bindgen; unmaintained, no vulnerability" },
]
