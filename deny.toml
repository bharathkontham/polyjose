# cargo-deny: enforces the pure-Rust crypto rule (no OpenSSL, ring or aws-lc) and license policy.
[bans]
multiple-versions = "warn"
deny = [
  { name = "openssl" }, { name = "openssl-sys" },
  { name = "ring" },
  { name = "aws-lc-rs" }, { name = "aws-lc-sys" },
  { name = "boring" }, { name = "boring-sys" },
  { name = "libsodium-sys" },
  # C/C++ build tooling: a pure-Rust tree never compiles native code (ADR 0002).
  #
  # `cc` has one exception, approved by the owner for feature 0006 T02 (pipeline Gate 2): its only
  # allowed direct dependent is `minicov`. wasm-bindgen-test 0.3.80 (a dev-dependency of
  # bindings/wasm) lists minicov, whose build script uses cc, only under
  # cfg(all(target_arch = "wasm32", wasm_bindgen_unstable_test_coverage)), a cfg nothing in this
  # repository sets, so neither crate is ever compiled. cargo-deny checks every target, so it still
  # sees them. `wrappers` (cargo-deny 0.20 src/bans.rs) allows a banned crate only when *every*
  # crate depending on it directly is listed: cc through any other crate, or through minicov plus
  # another crate, stays banned. scripts/tests/deny/cc-wrapper.sh proves that on a planted copy.
  # What cargo-deny does not catch: minicov moving into a normal tree (a normal dependency of a
  # binding or of the core). cc's only direct dependent would still be minicov, so this ban would
  # still pass. scripts/check-deps.sh's allowlists catch that instead: minicov is in neither
  # deps-allowlist.txt (check 1, the core's normal and build tree) nor any
  # bindings/deps-allowlist/<name>.txt (check 13, a binding's normal tree).
  { name = "cc", wrappers = ["minicov"] }, { name = "cmake" },
]

[sources]
# Only crates.io (the allow-registry default, stated explicitly): no git source, no other registry.
# cargo-deny does not check path sources; scripts/check-deps.sh rejects them in the core's tree.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]

[advisories]
# RUSTSEC-2023-0071 (Marvin) is not ignored: rsa 0.10.0, the exact pin, is its first patched release
# (advisory-db `patched = [">= 0.10.0"]`; ADR 0067). RSA private-key operations are allowed only
# through rsa's blinded entry points and only in the RSA files; key generation, RSA1_5, unblinded
# paths and hazmat stay blocked by scripts/check-deps.sh (checks 9-12) and
# scripts/check-rsa-symbols.sh (ADR 0067 §6, ADR 0049 §1). Never add an ignore for an rsa advisory.
ignore = [
  # basic-toml is *unmaintained* (not a vulnerability). It reaches us only through uniffi_bindgen,
  # the build-time code generator behind uniffi's "cli" feature; it is never linked into a shipped
  # library. Re-check on every uniffi upgrade and drop this entry as soon as uniffi stops using it.
  { id = "RUSTSEC-2026-0374", reason = "build-time only via uniffi_bindgen; unmaintained, no vulnerability" },
]
