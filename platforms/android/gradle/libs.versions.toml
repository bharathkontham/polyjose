# Every version the Kotlin build uses (ADR 0033 §1). Upgrading one is its own change (0008 plan,
# risks: "AGP/Gradle versions move quickly"). The Gradle version is in gradle/wrapper.

[versions]
# Android Gradle Plugin 9.5: needs Gradle >= 9.6 and JDK 17+, compiles up to API 37; Kotlin is
# built in, so the Android module applies only com.android.library (0008 research §3).
agp = "9.5.1"
kotlin = "2.4.21"
# UniFFI's generated Kotlin needs JNA >= 5.12 (direct mapping, Native.register).
jna = "5.19.1"
# JUnit 5 through its BOM; Gradle 9 needs junit-platform-launcher on the test runtime classpath.
junit5 = "5.14.4"
# org.json reads the conformance vectors on the JVM; Android has it built in (0008 research §3).
orgJson = "20260814"
# Instrumented tests (ADR 0033 §5): AndroidJUnitRunner and InstrumentationRegistry, JUnit 4 API.
androidxTestRunner = "1.7.0"
junit4 = "4.13.2"
# Maven Central publishing (ADR 0011); applied by the packaging task, not here.
mavenPublish = "0.37.0"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
