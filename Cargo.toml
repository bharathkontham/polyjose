[workspace]
resolver = "3"
members = ["crates/polyjose", "bindings/node", "bindings/wasm", "bindings/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/bharathkontham/polyjose"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
polyjose = { path = "crates/polyjose" }
# Dev-only test oracles (ADR 0016 §5): never a runtime dependency of crates/polyjose.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64ct = { version = "1.8", features = ["alloc"] }
# Default features off (ADR 0016 §3). No `derive` (it pulls syn, quote and proc-macro2): Zeroize and
# Drop are written by hand. `alloc` provides Zeroize for the String and Vec<u8> inside Zeroizing<_>.
# 1.9.1 is the floor: it fixes an uninitialized read in 1.9.0. polyjose's redacting Debug output does
# not depend on zeroize's own Debug impls (which 1.9.0 and 1.9.1 print differently).
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# Default features (std, i128) off (ADR 0016 §3): polyjose uses only Choice and ConstantTimeEq on u32,
# which need neither.
subtle = { version = "2.6", default-features = false }
# Dev-only: property tests (ADR 0008 layer 2).
proptest = { version = "1.12", default-features = false, features = ["std"] }
# OS CSPRNG: the only source of randomness (ADR 0005). Default features off (ADR 0016); polyjose uses
# only `getrandom::fill`, so it enables none of `std`, `sys_rng` or `wasm_js`. Only the WASM binding
# enables `wasm_js` (bindings/wasm/Cargo.toml).
getrandom = { version = "0.4.3", default-features = false }
# SHA-256 (FIPS 180-4) for RFC 7638 JWK thumbprints: the core's first crypto primitive (ADR 0002).
# Exact pin (ADR 0019 §4) on the latest 0.11.x, which needs Rust 1.88 (ADR 0024). Default features
# (`alloc`, `oid`) off (ADR 0016): polyjose needs only the `Digest` API. `zeroize` wipes the hash
# state on drop, since an `oct` thumbprint hashes the secret `k` (RFC 7638 §7).
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# JWS primitives (feature 0002, ADR 0002). Every crypto crate is pinned exactly (ADR 0019 §4) and
# turns default features off (ADR 0016 §3); the ones enabled are what polyjose calls. Their own
# re-exports (`p256::elliptic_curve::rand_core`, `signature`, `ecdsa`) are used instead of direct
# dependencies on those crates.
# HMAC (RFC 2104) for HS256/384/512 (RFC 7518 §3.2). `zeroize` wipes the keyed state on drop.
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
# ECDSA (RFC 7518 §3.4, RFC 8812 §3.2) and on-curve checks at JWK import (ADR 0041 §4). `ecdsa`
# is the curve arithmetic, the ECDSA algorithm and the matching SHA-2 hash; nothing else (no `std`,
# `pem`, `pkcs8`, `serde` or `precomputed-tables`). `ecdh` (P-256/384/521 only) adds the
# Diffie-Hellman of JWE ECDH-ES (RFC 7518 §4.6) on the same arithmetic.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "ecdh"] }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "ecdh"] }
p521 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "ecdh"] }
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
# EdDSA over Ed25519 (RFC 8037 §3.1). `zeroize` wipes the signing key on drop; `fast` (precomputed
# tables) stays off. Its curve25519-dalek brings the guarded build-time groups of ADR 0025/0042.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
# RSA, public-key operations only (ADR 0021): RS256/384/512 and PS256/384/512 verification
# (RFC 7518 §3.3, §3.5), later RSA-OAEP-256 encryption. RUSTSEC-2023-0071 (Marvin) affects the
# private-key operations of every rsa release, so no feature is enabled: no `getrandom` (blinded
# signing), no `encoding` (pkcs1/pkcs8/spki; polyjose owns DER), no `sha1` (ADR 0022) and no
# `hazmat`. scripts/check-deps.sh rejects any rsa feature and any private-key use, and deny.toml
# ignores the advisory only while that guard holds. Exact pin on a release candidate: the 0.10 API
# may still change before 0.10.0, so moving to a newer rc is its own PR.
rsa = { version = "=0.10.0-rc.20", default-features = false }
# X25519 (RFC 7748) keys for the OKP `X25519` curve (RFC 8037 §2, §3.2): key generation derives the
# public `x` from a 32-octet private key (RFC 7748 §6.1), and feature 0003 runs ECDH-ES on it.
# `static_secrets` gives `StaticSecret`, the reusable private key a JWK holds (an `EphemeralSecret`
# cannot be built from stored bytes); `zeroize` wipes it on drop. `precomputed-tables` (a default)
# stays off, as for ed25519-dalek. It reuses ed25519-dalek's curve25519-dalek, so it adds only itself
# to the tree.
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
# Still to come with their features: aes-gcm 0.11, aes-kw 0.3, cbc 0.2, pbkdf2 0.13 (feature 0003).
# JWE primitives (feature 0003, ADR 0002), exact pins (ADR 0019 §4), default features off
# (ADR 0016 §3).
# AES (FIPS 197), the block cipher under AES-GCM, AES Key Wrap and AES-CBC. 0.9.4 is the latest and
# needs Rust 1.89 (ADR 0024, raised at 0003 Gate 1). `zeroize` wipes the key schedules on drop.
aes = { version = "=0.9.4", default-features = false, features = ["zeroize"] }
# AES-GCM for A128/192/256GCM (RFC 7518 §5.3) and A*GCMKW (RFC 7518 §4.7). `aes` is the cipher;
# `zeroize` wipes the GHASH key. No `alloc`, `getrandom` or `rand_core`: polyjose draws IVs itself
# (ADR 0005) and uses the detached in-place API.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
# AES Key Wrap (RFC 3394) for A128/192/256KW (RFC 7518 §4.4), and the wrapping step of PBES2 and
# ECDH-ES+A*KW. No `oid`.
aes-kw = { version = "=0.3.1", default-features = false, features = ["zeroize"] }
# AES-CBC with PKCS#7 padding for A128CBC-HS256/A192CBC-HS384/A256CBC-HS512 (RFC 7518 §5.2).
cbc = { version = "=0.2.1", default-features = false, features = ["block-padding", "alloc", "zeroize"] }
# PBKDF2 (RFC 8018 §5.2) for PBES2 (RFC 7518 §4.8), over the pinned hmac and sha2. Only `hmac`: no
# password-hash, MCF/PHC or `kdf` support.
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
# Dev-only: the differential oracle for polyjose's own DEFLATE codec (ADR 0017); never shipped.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
