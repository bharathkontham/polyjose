[workspace]
resolver = "3"
members = ["crates/polyjose", "bindings/node", "bindings/wasm", "bindings/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bharathkontham/polyjose"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
polyjose = { path = "crates/polyjose" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64ct = { version = "1.8", features = ["alloc"] }
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
# Dev-only: property tests (ADR 0008 layer 2).
proptest = { version = "1.12", default-features = false, features = ["std"] }
# OS CSPRNG: the only source of randomness (ADR 0005). Default features off (ADR 0016); polyjose uses
# only `getrandom::fill`, so it enables none of `std`, `sys_rng` or `wasm_js`. Only the WASM binding
# enables `wasm_js` (bindings/wasm/Cargo.toml).
getrandom = { version = "0.4.3", default-features = false }
# SHA-256 (FIPS 180-4) for RFC 7638 JWK thumbprints: the core's first crypto primitive (ADR 0002).
# Exact pin (ADR 0019 §4). 0.11.0, not 0.11.1: 0.11.1 needs Rust 1.88 and the workspace declares
# rust-version 1.85 until feature 0002 T01 raises it (ADR 0024). Default features (`alloc`, `oid`)
# off (ADR 0016): polyjose needs only the `Digest` API. `zeroize` wipes the hash state on drop, since
# an `oct` thumbprint hashes the secret `k` (RFC 7638 §7).
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# Crypto: pure-Rust crates only (enforced by deny.toml) — added per algorithm as each feature lands:
# hmac 0.13, sha1 0.11, p256/p384/p521/k256 0.14, ed25519-dalek 3, x25519-dalek 3,
# aes-gcm 0.11, aes-kw 0.3, cbc 0.2, pbkdf2 0.13, rsa 0.10 (constant-time; never 0.9, see SECURITY.md).
