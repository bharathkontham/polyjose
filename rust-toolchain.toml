# Exact pin, so local builds and CI (which installs from this file) compile with the same rustc.
# Bump it deliberately, in its own commit. The MSRV (`rust-version`, 1.89 since 0003 Gate 1,
# ADR 0024 as amended) is checked separately.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
targets = [
  "wasm32-unknown-unknown",
  "aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android", "i686-linux-android",
  "aarch64-apple-ios", "aarch64-apple-ios-sim", "x86_64-apple-ios",
  "aarch64-apple-darwin", "x86_64-apple-darwin",
  "aarch64-apple-tvos", "aarch64-apple-tvos-sim",
  "aarch64-apple-visionos", "aarch64-apple-visionos-sim",
  "aarch64-apple-watchos", "aarch64-apple-watchos-sim",
]
# The aarch64 tvOS, visionOS and watchOS targets (device and simulator) are tier 2 with prebuilt std
# since Rust 1.95.0, so every XCFramework slice builds on this stable toolchain except one:
# arm64_32-apple-watchos is still tier 3 and is built with the nightly pinned in
# platforms/swift/nightly-toolchain and `-Zbuild-std` (ADR 0032 §1, amending ADR 0004).
