# Release build (feature 0012 H3; ADR 0037 §2-§3, ADR 0038 §2). Builds, checks, checksums, signs
# and attests every artifact of a polyjose release, and in tag mode puts them into a DRAFT GitHub
# Release. It never publishes: no registry upload, no `cargo publish` without --dry-run, no npm
# publish, no Central Portal call, no un-draft. Publishing is publish.yml, behind the owner's
# approval of environment `publish` (Gate 3; ADR 0038 §1).
#
# Trigger: workflow_dispatch only (ADR 0044; owner, 2026-11-08). There is no tag-push trigger,
# unlike ADR 0037 §2 (decisions.md, 2026-11-08, H3). Two modes:
#   - candidate: dispatched on the release PR branch. Builds every artifact unsigned (the build
#     jobs never reach the signing key: environment `release-signing` admits `v*` tags only),
#     checks and checksums them, attests them, and uploads them as the `release-assets` workflow
#     artifact. No release is created. The release agent then records the Apple zip of this run in
#     platforms/swift/release-candidate.json and Package.swift (ADR 0037 §2 option 4a).
#   - tag: dispatched with "Use workflow from" = the tag vX.Y.Z and input tag = the same vX.Y.Z.
#     The verify job requires github.ref to be refs/tags/<tag>, the tag commit to be on main, the
#     manifests to hold X.Y.Z and CHANGELOG.md to have its section. The Apple zip is not rebuilt:
#     it is the candidate run's, verified by scripts/release/apple-candidate.sh. Everything else is
#     rebuilt from the tag. The sums job signs the Maven artifacts and SHA256SUMS in environment
#     `release-signing`; the draft job creates the draft release.
#
# Permissions: top-level contents: read; each job states its own. id-token, attestations and
# artifact-metadata write only on attest, contents: write only on draft, actions: read only on
# apple-candidate (to download the candidate run's artifact). Secrets reach only the sums job in
# tag mode, through `env:` (never inline in `run:`), and the key is imported into a temporary
# GNUPGHOME under $RUNNER_TEMP that the same step deletes. Inputs reach `run:` only through `env:`
# and are validated by the verify job before any other job starts.
#
# Every third-party action is pinned to a full commit SHA, the comment naming the release tag it
# was resolved from (gh api, 2026-11-08); the pins are the ones of the binding workflows.
name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "candidate (on the release PR branch; unsigned, no release) or tag (from the tag ref; signed draft release)"
        type: choice
        options: [candidate, tag]
        required: true
        default: candidate
      tag:
        description: "tag mode only: the tag being released, vX.Y.Z (the same ref as 'Use workflow from')"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # The inputs, the ref, the versions, and in tag mode the tag, main and the CHANGELOG section.
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.inputs.outputs.tag }}
    steps:
      - name: the inputs and the ref
        id: inputs
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
        run: |
          case $MODE in
            candidate)
              [ -z "$TAG" ] || { echo "::error::candidate mode takes no tag input"; exit 1; }
              [ "$GITHUB_REF_TYPE" = branch ] || { echo "::error::candidate mode runs on the release PR branch, not on $GITHUB_REF"; exit 1; }
              echo "mode: candidate on $GITHUB_REF at $GITHUB_SHA"
              ;;
            tag)
              [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the tag input must be vX.Y.Z"; exit 1; }
              [ "$GITHUB_REF" = "refs/tags/$TAG" ] || { echo "::error::tag mode must be dispatched from the tag itself ('Use workflow from' = $TAG), not $GITHUB_REF"; exit 1; }
              echo "tag=$TAG" >>"$GITHUB_OUTPUT"
              echo "mode: tag $TAG at $GITHUB_SHA"
              ;;
            *) echo "::error::the mode input must be candidate or tag"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: no cargo config
        run: scripts/check-no-cargo-config.sh

      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - name: the version
        id: version
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
        run: |
          version=$(awk '/^\[/ { t = ($0 == "[workspace.package]") } t && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' Cargo.toml)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Cargo.toml [workspace.package] version '$version' is not X.Y.Z"; exit 1; }
          if [ "$MODE" = tag ]; then
            [ "v$version" = "$TAG" ] || { echo "::error::the tag $TAG is not v$version (Cargo.toml)"; exit 1; }
            mkdir -p "$RUNNER_TEMP/notes"
            scripts/release/check-version.sh "$version" --notes "$RUNNER_TEMP/notes/notes.md"
          else
            scripts/release/check-version.sh "$version"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: the tag commit is on main (tag mode)
        if: inputs.mode == 'tag'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
          [ "$tagged" = "$GITHUB_SHA" ] || { echo "::error::refs/tags/$TAG is $tagged, but this run is at $GITHUB_SHA"; exit 1; }
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || { echo "::error::origin/main was not fetched"; exit 1; }
          git merge-base --is-ancestor "$tagged" refs/remotes/origin/main || { echo "::error::$TAG ($tagged) is not on main"; exit 1; }
          echo "$TAG is $tagged, on main"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode == 'tag'
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error

  # The crate as crates.io would receive it, and cargo's own publish checks without uploading.
  crate:
    name: crate (cargo package, cargo publish --dry-run)
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: no cargo config
        run: scripts/check-no-cargo-config.sh

      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - name: cargo package and cargo publish --dry-run
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cargo package -p polyjose --locked
          cargo publish -p polyjose --locked --dry-run
          crate=target/package/polyjose-$VERSION.crate
          [ -f "$crate" ] || { echo "::error::cargo package wrote no $crate"; exit 1; }
          mkdir -p target/release-crate
          cp "$crate" target/release-crate/
          sha256sum target/release-crate/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: target/release-crate/*.crate
          if-no-files-found: error

  # The platform workflows in release mode (ADR 0037 §1, §2 option 3a): the same build and tests as
  # CI, uploading the fixed-name artifacts the sums job collects.
  node:
    name: node
    needs: [verify]
    permissions:
      contents: read
    uses: ./.github/workflows/binding-node.yml
    with:
      mode: release

  wasm:
    name: wasm
    needs: [verify]
    permissions:
      contents: read
    uses: ./.github/workflows/binding-wasm.yml
    with:
      mode: release

  android:
    name: android
    needs: [verify]
    permissions:
      contents: read
    uses: ./.github/workflows/binding-android.yml
    with:
      mode: release

  # Candidate mode only: the XCFramework with every slice, from this commit.
  apple:
    name: apple
    needs: [verify]
    if: inputs.mode == 'candidate'
    permissions:
      contents: read
    uses: ./.github/workflows/binding-apple.yml
    with:
      mode: release

  # Tag mode only: the candidate run's XCFramework zip, never rebuilt (ADR 0037 §2 option 4a;
  # the narrower tree rule is scripts/release/apple-candidate.sh's, decisions.md 2026-11-08, H3).
  apple-candidate:
    name: apple (the candidate zip)
    needs: [verify]
    if: inputs.mode == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: the candidate run of platforms/swift/release-candidate.json, and its zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          json=platforms/swift/release-candidate.json
          [ -f "$json" ] || { echo "::error::$json is missing: the release PR records the candidate run"; exit 1; }
          run_id=$(jq -r '.run_id' "$json")
          commit=$(jq -r '.commit' "$json")
          [[ $run_id =~ ^[0-9]+$ ]] || { echo "::error::$json: run_id is not a run id"; exit 1; }
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$json: commit is not a 40-hex commit"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            --jq '[.path, .head_sha, .event, .status, .conclusion, .repository.full_name] | @tsv' >"$RUNNER_TEMP/run.tsv"
          IFS=$'\t' read -r path head event status conclusion repo <"$RUNNER_TEMP/run.tsv"
          echo "candidate run $run_id: $path $head $event $status $conclusion $repo"
          [ "$path" = .github/workflows/release.yml ] || { echo "::error::run $run_id is not a release.yml run"; exit 1; }
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::run $run_id is not in $GITHUB_REPOSITORY"; exit 1; }
          [ "$event" = workflow_dispatch ] || { echo "::error::run $run_id was not dispatched"; exit 1; }
          [ "$status" = completed ] && [ "$conclusion" = success ] || { echo "::error::run $run_id did not succeed"; exit 1; }
          [ "$head" = "$commit" ] || { echo "::error::run $run_id built $head, not the recorded $commit"; exit 1; }
          git cat-file -e "$commit^{commit}" 2>/dev/null || git fetch --no-tags origin "$commit"
          dir=$RUNNER_TEMP/apple-candidate
          gh run download "$run_id" --name apple-xcframework --dir "$dir"
          ls -l "$dir"
          scripts/release/apple-candidate.sh "$dir" "$TAG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-xcframework
          path: |
            ${{ runner.temp }}/apple-candidate/PolyjoseFFI.xcframework.zip
            ${{ runner.temp }}/apple-candidate/PolyjoseFFI.xcframework.zip.sha256
          if-no-files-found: error

  # Every asset of ADR 0037 §3, checked (names, versions, THIRD-PARTY-NOTICES.txt, the node addon
  # pins, the Maven checksums) and listed in SHA256SUMS by scripts/release/assemble.sh. In tag mode
  # it runs in environment `release-signing` and signs the Maven artifacts and SHA256SUMS with the
  # release key's primary key, then verifies SHA256SUMS.asc with the committed public key
  # (scripts/release/verify-draft.sh), as publish.yml will. Candidate mode has no environment, so
  # no secret, and nothing is signed.
  sums:
    name: sums (assemble, SHA256SUMS${{ inputs.mode == 'tag' && ', signed' || '' }})
    needs: [verify, crate, node, wasm, android, apple, apple-candidate]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && needs.crate.result == 'success' &&
      needs.node.result == 'success' && needs.wasm.result == 'success' && needs.android.result == 'success' &&
      ((inputs.mode == 'candidate' && needs.apple.result == 'success') ||
      (inputs.mode == 'tag' && needs.apple-candidate.result == 'success')) }}
    environment: ${{ inputs.mode == 'tag' && 'release-signing' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: ${{ runner.temp }}/in/crate

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-*
          path: ${{ runner.temp }}/in/npm
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-repo
          path: ${{ runner.temp }}/in/maven-repo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-xcframework
          path: ${{ runner.temp }}/in/apple

      - name: assemble (candidate mode, unsigned)
        if: inputs.mode == 'candidate'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/release/assemble.sh "$RUNNER_TEMP/in" "$RUNNER_TEMP/release-assets" "$VERSION"

      # The key is imported from the secret into a temporary GNUPGHOME under $RUNNER_TEMP (never
      # into the workspace) and must be exactly the key of the GPG_FINGERPRINT variable. The
      # passphrase reaches gpg on a pipe (scripts/release/lib.sh rel_sign) and is never printed.
      # The trap kills the agent and deletes the home on every exit.
      - name: assemble and sign (tag mode, release-signing)
        if: inputs.mode == 'tag'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        run: |
          [[ $GPG_FINGERPRINT =~ ^[0-9A-F]{40}$ ]] || { echo "::error::the repository variable GPG_FINGERPRINT is not 40 upper-case hex digits"; exit 1; }
          [ -n "$GPG_SIGNING_KEY" ] && [ -n "$GPG_SIGNING_KEY_PASSWORD" ] || { echo "::error::GPG_SIGNING_KEY or GPG_SIGNING_KEY_PASSWORD is empty (environment release-signing)"; exit 1; }
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_SIGNING_KEY" | gpg --batch --no-tty --quiet --import >/dev/null 2>&1 ||
            { echo "::error::gpg cannot import GPG_SIGNING_KEY"; exit 1; }
          unset GPG_SIGNING_KEY
          primaries=$(gpg --batch --no-tty --with-colons --list-secret-keys |
            awk -F: '$1 == "sec" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }')
          [ "$primaries" = "$GPG_FINGERPRINT" ] || { echo "::error::GPG_SIGNING_KEY is not exactly the secret key $GPG_FINGERPRINT"; exit 1; }
          export RELEASE_GPG_FPR=$GPG_FINGERPRINT
          scripts/release/assemble.sh --sign "$RUNNER_TEMP/in" "$RUNNER_TEMP/release-assets" "$VERSION"
          scripts/release/verify-draft.sh "$RUNNER_TEMP/release-assets" "$TAG" .github/keys/polyjose-release.asc "$GPG_FINGERPRINT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  # Build provenance for every asset (ADR 0037 §2; `gh attestation verify <file> --repo <repo>`).
  # Every job below sums needs a status function: apple or apple-candidate is skipped by design in
  # each mode, and a bare (implicit success()) condition skips on any skipped ancestor (v0.1.0 made
  # no draft for this reason).
  attest:
    name: attest
    needs: [sums]
    if: ${{ !cancelled() && needs.sums.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

  # Tag mode only: the draft release with every asset (ADR 0037 §3). The only job with
  # contents: write. --verify-tag refuses to create a tag; --draft keeps it unpublished.
  draft:
    name: draft release
    needs: [verify, sums, attest]
    if: >-
      ${{ !cancelled() && inputs.mode == 'tag' && needs.verify.result == 'success' &&
      needs.sums.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: gh release create --draft --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag"; exit 1; }
          notes=$RUNNER_TEMP/notes/notes.md
          {
            echo
            echo "---"
            echo
            echo "Every asset is listed in SHA256SUMS, signed in SHA256SUMS.asc by the release key"
            echo "($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/.github/keys/polyjose-release.asc), and has a"
            echo "build-provenance attestation ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/attestations):"
            echo "\`gh attestation verify <asset> --repo $GITHUB_REPOSITORY\`."
          } >>"$notes"
          cd "$RUNNER_TEMP/release-assets"
          ls -l
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; a tag is never re-released (ADR 0037 §2)"
            exit 1
          fi
          gh release create "$TAG" --draft --verify-tag --title "polyjose $VERSION" --notes-file "$notes" -- *
          gh release view "$TAG" --json isDraft,assets --jq '"draft: \(.isDraft), \(.assets | length) assets"'
