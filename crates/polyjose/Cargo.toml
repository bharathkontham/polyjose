[package]
name = "polyjose"
description = "Pure-Rust JOSE: JWA, JWK, JWS, JWE and JWT per the RFCs, with no OpenSSL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["jose", "jwt", "jws", "jwe", "jwk"]
categories = ["cryptography", "authentication", "wasm"]

[lints]
workspace = true

[features]
default = []
# NEVER enable in production or in a binding (ADR 0005). Exposes `polyjose::test_vectors`, a
# deterministic byte source used only to reproduce published test vectors (RFC 7520 JWE outputs).
# scripts/check-test-vectors-off.sh fails the build if any binding enables it.
test-vectors = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64ct.workspace = true
zeroize.workspace = true
subtle.workspace = true
getrandom.workspace = true
